name: Package Skills

on:
    push:
        branches: [main]

concurrency:
    group: package-skills-${{ github.ref }}
    cancel-in-progress: false

jobs:
    zip-and-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set release tag (date-based)
              id: tag
              run: echo "TAG=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

            - name: Create zip package
              run: |
                  # Bundle the entire marketplace (Claude + Codex marketplace
                  # catalogs, every plugin under plugins/, README, LICENSE) so
                  # the release zip is a complete plugin snapshot for offline
                  # use. Live install via the `skills` CLI / `/plugin
                  # marketplace add papermark/skills` continues to work off the
                  # cloned repo.
                  zip -r papermark-skills.zip \
                      .claude-plugin \
                      .agents \
                      .mcp.json \
                      plugins \
                      README.md \
                      LICENSE.md

            - name: Delete existing release for today (if re-running)
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.TAG }}
              run: |
                  gh release delete "$TAG" --yes 2>/dev/null || true
                  git push --delete origin "$TAG" 2>/dev/null || true

            - name: Publish release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.tag.outputs.TAG }}
                  SHA: ${{ github.sha }}
              run: |
                  gh release create "$TAG" papermark-skills.zip \
                      --title "Papermark Skills — $TAG" \
                      --notes "Automated skills package generated on $TAG. Triggered by commit $SHA." \
                      --target "$SHA" \
                      --latest
